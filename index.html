<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Administrador de Reportes - Colegio Latino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 p-2 md:p-4 min-h-screen">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-3 md:p-6">
    
    <div class="flex justify-between items-center border-b pb-3 mb-3">
      <div>
        <h1 class="text-lg font-black text-slate-800">COLEGIO LATINO</h1>
        <p class="text-[11px] font-bold text-slate-500">Panel de Control y Notificaciones de Tareas</p>
      </div>
      <button onclick="cargarDatos()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-md font-bold hover:bg-slate-700">
        🔄 Actualizar Lista
      </button>
    </div>

    <!-- PESTAÑAS -->
    <div class="flex border-b mb-3 space-x-3 text-xs">
      <button id="btn-tab-pendientes" onclick="cambiarTab('Pendiente')" class="pb-1.5 border-b-2 border-amber-500 font-bold text-amber-600">
        📌 Pendientes de Envío
      </button>
      <button id="btn-tab-enviados" onclick="cambiarTab('Enviado')" class="pb-1.5 border-b-2 border-transparent font-bold text-slate-400 hover:text-slate-600">
        ✅ Historial Enviados
      </button>
    </div>

    <div id="cargando" class="text-center py-4">
      <div id="spinner" class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-indigo-600 border-t-transparent mb-1"></div>
      <p class="text-[11px] font-semibold text-slate-500">Cargando lista de reportes...</p>
    </div>

    <!-- LISTADO ULTRA COMPACTO -->
    <div id="lista-reportes" class="space-y-1.5"></div>

  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxA_yMZUZgrCgVLPrNkGAL94455kLej_-sm1MaVpdbsLiNne3A2_WWfWrbSGGwUliNFcQ/exec';

    let db = { profesores: [], alumnos: [], reportes: [] };
    let tabActual = 'Pendiente';

    window.onload = function() {
      const cached = localStorage.getItem('colegio_latino_db');
      if (cached) {
        db = JSON.parse(cached);
        document.getElementById('cargando').classList.add('hidden');
        renderReportes();
      }
      cargarDatos();
    };

    function cargarDatos() {
      fetch(WEB_APP_URL + '?action=getDatos')
        .then(res => res.json())
        .then(data => {
          db = data;
          localStorage.setItem('colegio_latino_db', JSON.stringify(data));
          document.getElementById('cargando').classList.add('hidden');
          renderReportes();
        });
    }

    function cambiarTab(tab) {
      tabActual = tab;
      document.getElementById('btn-tab-pendientes').className = tab === 'Pendiente' 
        ? 'pb-1.5 border-b-2 border-amber-500 font-bold text-amber-600' 
        : 'pb-1.5 border-b-2 border-transparent font-bold text-slate-400 hover:text-slate-600';
      
      document.getElementById('btn-tab-enviados').className = tab === 'Enviado' 
        ? 'pb-1.5 border-b-2 border-emerald-600 font-bold text-emerald-600' 
        : 'pb-1.5 border-b-2 border-transparent font-bold text-slate-400 hover:text-slate-600';

      renderReportes();
    }

    // FUNCIÓN PARA FORMATO DE FECHA LARGA Y CLARA EN ESPAÑOL
    function formatearFechaLarga(fechaStr) {
      if (!fechaStr) return 'Fecha no especificada';
      try {
        let partes = fechaStr.split('T')[0].split('-');
        let fechaObj = partes.length === 3 
          ? new Date(partes[0], partes[1] - 1, partes[2])
          : new Date(fechaStr);

        if (isNaN(fechaObj.getTime())) return fechaStr;

        let opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let texto = fechaObj.toLocaleDateString('es-MX', opciones);
        return texto.charAt(0).toUpperCase() + texto.slice(1);
      } catch (e) {
        return fechaStr;
      }
    }

    function renderReportes() {
      const container = document.getElementById('lista-reportes');
      const reportesFiltrados = (db.reportes || []).filter(r => r.estatus === tabActual);

      if (reportesFiltrados.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs">No hay reportes ${tabActual.toLowerCase()}s.</p>`;
        return;
      }

      const agrupados = {};
      reportesFiltrados.forEach(r => {
        if (!agrupados[r.alumno]) agrupados[r.alumno] = [];
        agrupados[r.alumno].push(r);
      });

      container.innerHTML = Object.keys(agrupados).map(alumnoNombre => {
        const incidencias = agrupados[alumnoNombre];
        const alumInfo = (db.alumnos || []).find(a => a.nombre === alumnoNombre) || {};
        const profInfo = (db.profesores || []).find(p => p.nombre === incidencias[0].profesor) || {};
        const cleanId = alumnoNombre.replace(/[^a-zA-Z0-9]/g, '');
        const materiasTexto = [...new Set(incidencias.map(i => i.materia))].join(', ');

        const fechaTareaClara = formatearFechaLarga(incidencias[0].fechaTarea || incidencias[0].fecha);
        const fechaRecepcionClara = formatearFechaLarga(incidencias[0].fechaRecepcion);

        return `
          <div class="border border-slate-200 rounded-md p-2 bg-white hover:bg-slate-50 transition flex flex-wrap md:flex-nowrap justify-between items-center text-xs gap-2">
            
            <!-- DATOS ALUMNO -->
            <div class="flex items-center space-x-2.5 min-w-[220px]">
              ${alumInfo.foto ? `<img src="${alumInfo.foto}" class="w-8 h-8 rounded-full object-cover shrink-0 border">` : `<div class="w-7 h-7 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold text-[10px] shrink-0">👤</div>`}
              <div class="truncate">
                <div class="font-bold text-slate-800 text-xs truncate">${alumnoNombre}</div>
                <div class="text-[10px] text-slate-500 font-semibold">${incidencias[0].grupo} • <b class="text-amber-600">${incidencias.length} reporte(s)</b></div>
              </div>
            </div>

            <!-- RESUMEN -->
            <div class="text-[11px] text-slate-600 truncate max-w-xs hidden lg:block">
              <span class="bg-slate-100 px-1.5 py-0.5 rounded border text-[10px]"><b>Asignaturas:</b> ${materiasTexto}</span>
            </div>

            <!-- BOTONES -->
            <div class="flex items-center space-x-1.5 font-bold text-[11px]">
              <button onclick="descargarPDF('${cleanId}')" class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700">
                📄 Generar PDF
              </button>
              ${alumInfo.telMama ? `<a href="https://wa.me/521${alumInfo.telMama}?text=Estimada\%20Mam\%C3\%A1,\%20le\%20notificamos\%20el\%20reporte\%20de\%20tarea\%20de\%20${encodeURIComponent(alumnoNombre)}" target="_blank" class="bg-emerald-600 text-white px-2 py-1 rounded">📲 Mamá</a>` : ''}
              ${alumInfo.telPapa ? `<a href="https://wa.me/521${alumInfo.telPapa}?text=Estimado\%20Pap\%C3\%A1,\%20le\%20notificamos\%20el\%20reporte\%20de\%20tarea\%20de\%20${encodeURIComponent(alumnoNombre)}" target="_blank" class="bg-emerald-600 text-white px-2 py-1 rounded">📲 Papá</a>` : ''}
              ${alumInfo.telAbuelo ? `<a href="https://wa.me/521${alumInfo.telAbuelo}?text=Estimado\%20Tutor,\%20le\%20notificamos\%20el\%20reporte\%20de\%20tarea\%20de\%20${encodeURIComponent(alumnoNombre)}" target="_blank" class="bg-emerald-600 text-white px-2 py-1 rounded">📲 Abuelito</a>` : ''}
              ${profInfo.telefono ? `<a href="https://wa.me/521${profInfo.telefono}?text=Estimado\%20Profesor,\%20se\%20ha\%20notificado\%20el\%20reporte\%20de\%20${encodeURIComponent(alumnoNombre)}" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded">👨‍‍🏫 Maestro</a>` : ''}

              <!-- CHECKBOX -->
              <label class="flex items-center space-x-1 font-bold text-slate-700 cursor-pointer bg-slate-100 px-1.5 py-1 rounded border ml-1">
                <input type="checkbox" ${tabActual === 'Enviado' ? 'checked' : ''} onchange="marcarEnviado('${incidencias[0].id}', this.checked)" class="w-3.5 h-3.5 text-emerald-600 rounded">
                <span class="text-[10px]">Enviado</span>
              </label>
            </div>

            <!-- PLANTILLA DE PDF OFICIAL CON ESQUINA AZUL Y FECHAS LARGAS -->
            <div class="hidden">
              <div id="pdf-area-${cleanId}" class="p-8 font-sans text-slate-900 leading-relaxed bg-white relative overflow-hidden" style="width: 700px;">
                
                <!-- CORNER DECORATIVO AZUL MARINO EN LA ESQUINA SUPERIOR IZQUIERDA -->
                <div style="position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 55px solid #0f172a; border-right: 55px solid transparent; z-index: 10;"></div>

                <!-- ENCABEZADO -->
                <div class="flex justify-between items-start border-b-2 border-slate-900 pb-3 mb-4 pl-6">
                  <div>
                    <h2 class="text-2xl font-black uppercase tracking-wider text-slate-950">COLEGIO LATINO</h2>
                    <p class="text-xs font-semibold text-slate-700">OLIVO S/N FRACC. LOS REYES</p>
                    <p class="text-xs font-semibold text-slate-700">TEL 937 37 2 28 63</p>
                  </div>
                  <div class="text-right flex items-center space-x-3">
                    <div>
                      <p class="text-sm font-black">No de REPORTE: <span class="text-red-700">${incidencias[0].id.replace(/\D/g, '').substring(6, 10) || '100'}</span></p>
                      <p class="text-xs font-bold text-slate-800">FECHA DE AVISO: ${fechaTareaClara}</p>
                    </div>
                    ${alumInfo.foto ? `<img src="${alumInfo.foto}" class="w-16 h-16 rounded-lg object-cover border border-slate-400 shrink-0">` : ''}
                  </div>
                </div>

                <!-- CUERPO DE LA CITATORIA / REPORTE -->
                <div class="text-sm space-y-4 my-6">
                  <p class="text-justify leading-relaxed">
                    Docente <b>${incidencias[0].profesor}</b> reporta que el alumno(a) 
                    <b class="text-base uppercase border-b-2 border-slate-900 px-1 font-black">${alumnoNombre}</b> 
                    debe tareas en las siguientes asignaturas: <b>${materiasTexto}</b>.
                  </p>

                  <div class="bg-slate-50 p-4 border border-slate-300 rounded-lg shadow-sm">
                    <p class="font-bold text-xs uppercase mb-2 text-slate-800 border-b pb-1">DETALLE DE TAREAS Y LIBROS PENDIENTES:</p>
                    <ul class="list-disc list-inside space-y-1.5 text-xs text-slate-800">
                      ${incidencias.map(i => `<li><b>[${i.materia}]:</b>${i.descripcion}</li>`).join('')}
                    </ul>
                  </div>

                  <!-- FECHA LÍMITE DESTACADA EN TEXTO LARGO CLARO -->
                  <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg">
                    <p class="font-black text-xs text-amber-900 uppercase">
                      📅 FECHA EN LA QUE SE RECIBIRÁ LA TAREA:
                    </p>
                    <p class="text-sm font-extrabold text-amber-950 mt-0.5">
                      ${fechaRecepcionClara}
                    </p>
                  </div>

                  <p class="text-xs italic text-slate-700 mt-4 leading-normal">
                    Lo anterior para que nos apoye y su hijo (a) se ponga al corriente con sus pendientes escolares.<br>
                    Gracias de antemano por su apoyo.
                  </p>
                </div>

                <!-- FIRMAS -->
                <div class="mt-16 text-center text-xs">
                  <p class="font-bold">Atte.</p>
                  <p class="font-black text-sm uppercase text-slate-900">Dirección de Secundaria y Preparatoria</p>
                  <div class="w-48 border-b border-slate-900 mx-auto mt-12"></div>
                  <p class="text-[10px] text-slate-600 mt-1 font-semibold">Firma de Enterado del Padre o Tutor</p>
                </div>

              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function descargarPDF(elementId) {
      const element = document.getElementById('pdf-area-' + elementId);
      element.parentElement.classList.remove('hidden');
      const opt = {
        margin:       0.3,
        filename:     'Reporte_Tarea_' + elementId + '.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save().then(() => {
        element.parentElement.classList.add('hidden');
      });
    }

    function marcarEnviado(idReporte, checked) {
      const nuevoEstatus = checked ? 'Enviado' : 'Pendiente';
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'cambiarEstatus', idReporte: idReporte, nuevoEstatus: nuevoEstatus })
      })
      .then(() => cargarDatos());
    }
  </script>
</body>
</html>
